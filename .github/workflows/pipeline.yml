name: CI/CD Pipeline GCS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =====================================================================
  # ETAPA 1: Qualidade — flake8 + pytest com cobertura, contra Postgres.
  # =====================================================================
  testes:
    name: Lint + Testes (flake8 / pytest)
    runs-on: ubuntu-latest

    # Banco de testes efêmero subido pelo próprio runner
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gcs_user
          POSTGRES_PASSWORD: gcs_pass
          POSTGRES_DB: gcs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gcs_user -d gcs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gcs_user:gcs_pass@localhost:5432/gcs_test
      TEST_DATABASE_URL: postgresql://gcs_user:gcs_pass@localhost:5432/gcs_test
      SECRET_KEY: chave-de-teste-ci
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: senha-dummy-ci

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instala dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Análise estática (flake8)
        run: flake8 .

      - name: Testes com cobertura (pytest --cov)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Publica relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # =====================================================================
  # ETAPA 2: Build da imagem Docker — só roda se a ETAPA 1 passar.
  # =====================================================================
  build-docker:
    name: Build da imagem Docker
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gcs-app:${{ github.sha }}
